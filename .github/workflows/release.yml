name: Release portable app

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v2.0.1.0. Leave empty to bump to the next version."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build release
        id: release
        run: ./release.ps1 -Tag "${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}"

      - name: Check the release folder
        # The app's own config must never ship, or copying a new folder over an
        # installed tablet would overwrite the settings there.
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'artifacts\GopsDailySheet'
          $config = Join-Path $folder 'GopsDailySheet.exe.config'
          $example = "$config.example"
          if (Test-Path -LiteralPath $config) {
            throw "The build produced $([System.IO.Path]::GetFileName($config)). A release must not ship it."
          }
          if (-not (Test-Path -LiteralPath $example)) {
            throw "The build did not produce $([System.IO.Path]::GetFileName($example)), so the app could not create a config file on first start."
          }
          Write-Host "Config ships as $([System.IO.Path]::GetFileName($example)); the app creates the real one on first start."

      - name: Fail if this release already exists
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.release.outputs.tag }}'
          if ($tag -notmatch '^v\d+(\.\d+){3}$') {
            throw "The release script did not report a usable tag (got '$tag')."
          }
          $headers = @{
            Authorization  = "Bearer $env:GH_TOKEN"
            Accept         = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent'   = 'gopsdailysheet-release'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $exists = $false
          try {
            Invoke-RestMethod -Uri $uri -Headers $headers | Out-Null
            $exists = $true
          }
          catch {
            # 404 is the answer we want: no release for this tag yet.
            $code = [int]$_.Exception.Response.StatusCode
            if ($code -ne 404) {
              throw "GitHub API returned $code while checking for a release for ${tag}: $($_.Exception.Message)"
            }
          }
          if ($exists) {
            throw "A release for $tag already exists and will not be replaced."
          }
          Write-Host "No existing release for $tag."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Push version commit to master
        # Manual runs only: the release script committed the version bump on this
        # runner, and it belongs on the branch so the repo shows what it released.
        # A tag-push run is already sitting on a commit the user pushed themselves.
        if: github.event_name == 'workflow_dispatch'
        run: |
          $ErrorActionPreference = 'Continue'
          $branch = '${{ github.event.repository.default_branch }}'
          git push origin "HEAD:$branch"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Could not push the version commit to $branch. The release is still published, but master keeps the old version."
          }

      - name: Push tag
        run: git push origin "refs/tags/${{ steps.release.outputs.tag }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            artifacts/GopsDailySheet-portable.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}